# Project-level Grok config for Draywar Alpha.
# Merged when working in this directory (folder must be trusted).

[mcp_servers.godot-mcp-pro]
command = "node"
args = ["C:/Godot/godot-mcp-pro/server/build/index.js"]
enabled = true
startup_timeout_sec = 60

[mcp_servers.godot-mcp-pro.env]
GODOT_MCP_PORT = "6505"
