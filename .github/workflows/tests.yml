# Draywar CI — headless import + smoke + GUT on every push / PR.
#
# Local equivalent: scripts/run_tests.ps1 (Windows Godot 4.6.1 console binary).
# CI installs the official Godot 4.6.1 Linux x86_64 build from GitHub releases.
# Godot 4.x has no separate "headless" Linux package; --headless is enough.
# Download:
#   https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
#
# ---------------------------------------------------------------------------
# WHY THIS FILE LOOKS PARANOID — read before "simplifying" it
# ---------------------------------------------------------------------------
# Until 2026-08-06 this workflow reported "success" on 22 consecutive runs while
# the game could not boot at all. Two independent faults made green meaningless:
#
#   1. NO IMPORT STEP. A fresh checkout has no `.godot/` directory, so Godot has
#      no global script class cache. Every script that references a `class_name`
#      type ("ContentItem", "BalanceSettings", ...) fails to parse. A fresh clone
#      booted with 1,454 errors. Running `--headless --import` first builds the
#      cache and the count drops to 0. See docs/traps.md #14.
#
#   2. GODOT EXITS 0 ANYWAY. `--quit-after` returns exit status 0 even when every
#      autoload failed to instantiate and 1,454 errors were printed. Trusting the
#      process exit code alone is therefore worthless for the smoke boot — the
#      log has to be inspected. Likewise GUT's exit code is only meaningful if
#      GUT actually ran; when the class cache was missing, gut_cmdln never
#      reached a test and the step still exited 0.
#
# So: the smoke step asserts ZERO error lines, and the GUT step asserts a real
# totals block with a plausible test count — not just an exit code.
#
# This job is also the fresh-clone regression test. actions/checkout produces
# exactly what a new machine or a buyer would get, and `.godot/` is gitignored,
# so if the smoke step is green then a fresh clone boots clean. Do not add
# `.godot/` to the cache — rebuilding it from scratch is the point.
#
# ---------------------------------------------------------------------------
# THE MCP AUTOLOAD DECISION (2026-08-06) — do not re-derive this
# ---------------------------------------------------------------------------
# `project.godot` used to declare three dev-tool autoloads plus an editor plugin
# entry pointing into `addons/godot_mcp/` (Godot MCP Pro). That directory is
# gitignored because the addon is PROPRIETARY and PURCHASED — its licence
# forbids redistribution — so committing it is not an option. The result was a
# repo that referenced files no clone would ever have: nine autoload errors on
# every fresh checkout, forever.
#
# DECISION: the MCP entries stay OUT of the committed `project.godot`.
#
# This costs nothing locally, because the addon manages those entries itself.
# `addons/godot_mcp/plugin.gd` injects its three autoloads in `_enter_tree()`
# and removes them again in `_exit_tree()` — but ONLY the ones it injected this
# session; anything already present is treated as project-owned and never
# cleaned up. That is exactly how they got stuck in the first place. With the
# committed file clean, the plugin injects on editor open and tidies up on
# editor close, and nothing leaks into git.
#
# On a fresh clone a developer who owns the addon enables it once via
# Project > Project Settings > Plugins. The "no MCP references" guard below
# stops the entries ever being committed again.
#
# Bar: suite runs automatically on push. Lint (gdtoolkit) is optional and not
# required here.

name: tests

on:
  push:
  pull_request:

env:
  # Floor for "did the suite actually run", not an exact expected count.
  # 818 tests as of 2026-08-06. Raise this as the suite grows — its job is to
  # turn a run that silently stops collecting tests red instead of green.
  MIN_TESTS: 800

jobs:
  gut:
    name: Headless import + smoke + GUT
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot 4.6.1
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: .godot-ci
          key: godot-4.6.1-stable-linux-x86_64

      - name: Download Godot 4.6.1 Linux
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .godot-ci
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d .godot-ci
          # Zip contains a single binary named Godot_v4.6.1-stable_linux.x86_64
          chmod +x .godot-ci/Godot_v4.6.1-stable_linux.x86_64
          ln -sf Godot_v4.6.1-stable_linux.x86_64 .godot-ci/godot
          .godot-ci/godot --version

      - name: Ensure godot launcher link
        run: |
          set -euo pipefail
          if [ ! -e .godot-ci/godot ]; then
            ln -sf Godot_v4.6.1-stable_linux.x86_64 .godot-ci/godot
          fi
          chmod +x .godot-ci/Godot_v4.6.1-stable_linux.x86_64
          .godot-ci/godot --version

      # Guard: the committed project must never point at the gitignored,
      # proprietary MCP addon again. See the decision note at the top of file.
      - name: Guard — no MCP addon references in project.godot
        run: |
          set -euo pipefail
          if grep -n "addons/godot_mcp" project.godot; then
            echo "::error file=project.godot::project.godot references addons/godot_mcp, which is gitignored (proprietary, licence forbids redistribution). Every fresh clone will fail to boot. The MCP plugin injects and removes its own autoloads — remove these lines and let it manage them. See the decision note in .github/workflows/tests.yml and docs/traps.md."
            exit 1
          fi
          echo "OK — project.godot has no godot_mcp references."

      # Without this, a fresh checkout has no global script class cache and
      # every class_name reference fails to parse. This is THE fix that turned
      # 1,454 boot errors into 0. It must run before smoke and GUT.
      - name: Import project (build .godot/ and the global class cache)
        run: |
          set -euo pipefail
          .godot-ci/godot --path "$GITHUB_WORKSPACE" --headless --import \
            > "$RUNNER_TEMP/import.log" 2>&1 || import_status=$?
          import_status="${import_status:-0}"
          cat "$RUNNER_TEMP/import.log"
          if [ "$import_status" -ne 0 ]; then
            echo "::error::Import exited $import_status."
            exit "$import_status"
          fi
          import_errors="$(grep -cE '^(ERROR|SCRIPT ERROR):' "$RUNNER_TEMP/import.log" || true)"
          echo "Import error lines: $import_errors"
          if [ "$import_errors" -ne 0 ]; then
            echo "::error::Import produced $import_errors error line(s); expected 0."
            exit 1
          fi

      # Godot exits 0 even when every autoload fails, so the exit code is not
      # evidence of anything. Count the error lines instead. Zero is the bar:
      # this is what proves a fresh clone boots clean.
      - name: Smoke boot (must produce ZERO errors)
        run: |
          set -euo pipefail
          .godot-ci/godot --path "$GITHUB_WORKSPACE" --headless --quit-after 2 \
            > "$RUNNER_TEMP/smoke.log" 2>&1 || smoke_status=$?
          smoke_status="${smoke_status:-0}"
          cat "$RUNNER_TEMP/smoke.log"
          if [ "$smoke_status" -ne 0 ]; then
            echo "::error::Smoke boot exited $smoke_status."
            exit "$smoke_status"
          fi
          smoke_errors="$(grep -cE '^(ERROR|SCRIPT ERROR):' "$RUNNER_TEMP/smoke.log" || true)"
          echo "Smoke boot error lines: $smoke_errors"
          if [ "$smoke_errors" -ne 0 ]; then
            echo "::error::Smoke boot produced $smoke_errors error line(s); expected 0. A fresh clone of this commit does not boot clean."
            exit 1
          fi
          echo "PASS — clean headless boot, 0 errors."

      # GUT's exit code is honest WHEN GUT RUNS (verified: a failing assert
      # exits 1). The historic failure was that it never ran and still exited 0,
      # so the totals block is checked as well. Note: some tests deliberately
      # push engine errors (assert_push_error), so error lines are NOT counted
      # in this step — only in the smoke boot above.
      - name: GUT suite (must report real totals and zero failures)
        run: |
          set -euo pipefail
          # Same CLI as scripts/run_tests.ps1: gut_cmdln + tests dir + exit.
          set +e
          .godot-ci/godot --path "$GITHUB_WORKSPACE" --headless \
            -s "res://addons/gut/gut_cmdln.gd" \
            -gdir=res://tests \
            -gexit \
            > "$RUNNER_TEMP/gut.log" 2>&1
          gut_status=$?
          set -e
          cat "$RUNNER_TEMP/gut.log"

          # Totals block shape (verified against a real 818-test run):
          #   Totals
          #   ------
          #   Scripts              93
          #   Tests               818
          #   Passing Tests       818
          #   Failing Tests         1   <- line absent entirely when zero
          # `|| true` matters: with pipefail a missing Totals block would abort
          # this step before the explicit diagnostics below could print.
          tests_run="$(grep -E '^Tests +[0-9]+' "$RUNNER_TEMP/gut.log" | tail -1 | awk '{print $2}' || true)"
          failing="$(grep -E '^Failing Tests +[0-9]+' "$RUNNER_TEMP/gut.log" | tail -1 | awk '{print $3}' || true)"
          tests_run="${tests_run:-0}"
          failing="${failing:-0}"

          echo "----------------------------------------"
          echo "GUT exit status : $gut_status"
          echo "Tests run       : $tests_run (floor: $MIN_TESTS)"
          echo "Failing tests   : $failing"
          echo "----------------------------------------"

          if [ "$tests_run" -eq 0 ]; then
            echo "::error::GUT reported no totals block — the suite never ran. This is the exact failure that made 22 consecutive runs green while the build was broken."
            exit 1
          fi
          if [ "$tests_run" -lt "$MIN_TESTS" ]; then
            echo "::error::Only $tests_run tests ran, below the floor of $MIN_TESTS. Either tests stopped being collected, or the floor needs raising deliberately in this workflow."
            exit 1
          fi
          if [ "$failing" -ne 0 ]; then
            echo "::error::$failing GUT test(s) failed."
            exit 1
          fi
          if [ "$gut_status" -ne 0 ]; then
            echo "::error::GUT exited $gut_status."
            exit "$gut_status"
          fi
          echo "PASS — $tests_run tests, 0 failures."
